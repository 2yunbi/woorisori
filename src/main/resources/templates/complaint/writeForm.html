<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
    <title>고충처리 글쓰기</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/complaint.css">
</head>
<section layout:fragment="content">
   <div class="board-wrap">
       <h4 class="board-card">고충 글쓰기</h4>

       <form id="writeForm" th:action="@{/complaint/new}" method="post" th:object="${form}">
           <div class="board-form-group">
               <label class="form-label">제목</label>
               <input type="text" class="board-title-input" th:field="*{subject}" placeholder="제목을 입력하세요.">
               <div class="text-danger small mt-1" th:if="${#fields.hasErrors('subject')}" th:errors="*{subject}"></div>
           </div>

           <div class="board-form-group">
               <label>내용</label>
               <div id="editor"></div>
               <textarea th:field="*{content}" id="content" hidden></textarea>
               <div class="text-danger small mt-1" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
           </div>

           <div class="board-actions">
               <a th:href="@{/complaint/list}" class="btn btn-outline-secondary">취소</a>
               <button type="submit" class="btn btn-primary">등록</button>
           </div>
       </form>
   </div>
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const editorEl = document.getElementById('editor');
            if (!editorEl) {
                console.error('editor 요소를 찾을 수 없습니다.');
                return;
            }

            const quill = new Quill(editorEl, {
                theme: 'snow',
                placeholder: '내용을 입력하세요...'
            });

            const contentField = document.getElementById('content');
            if (contentField.value) {
                quill.root.innerHTML = contentField.value;
            }
            document.getElementById('writeForm').addEventListener('submit', function () {
                contentField.value = quill.root.innerHTML;
            });
        });
    </script>
</section>
<div layout:fragment="script">
    <script src="/js/createMemberForm.js"></script>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</html>
