<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
    <title>고충처리</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/complaint.css">
</head>
<section layout:fragment="content">
    <div class="board-list-header">
        <h4>고충처리</h4>
    </div>

    <div class="board-wrap">
       <div class="board-card">
           <h4 th:text="${complaint.subject}"></h4>
           <p class="text-muted">
               <span th:text="${complaint.status}"></span>
               <span th:text="${#temporals.format(complaint.createDate, 'yyyy-MM-dd HH:mm')}"></span>
           </p>
        <div th:utext="${complaint.content}"></div>
        <div class="board-actions">
            <a th:href="@{/complaint/list}" class="btn btn-outline-secondary">목록으로</a>
        </div>
       </div>
    </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</html>
